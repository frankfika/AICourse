name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-production to continue
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == 'deploy-production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: 49.234.25.35
      DEPLOY_USER: ubuntu
      DEPLOY_PATH: /opt/aicourse
      API_IMAGE: ghcr.io/frankfika/aicourse-api:${{ github.sha }}
      WEB_IMAGE: ghcr.io/frankfika/aicourse-web:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Require deployment secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 0600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0644 "$HOME/.ssh/known_hosts"
      - name: Authenticate the host to GHCR for this deployment
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
      - name: Upload immutable release bundle
        run: |
          git archive --format=tar.gz --output "$RUNNER_TEMP/aicourse-release.tar.gz" "$GITHUB_SHA"
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -d '$DEPLOY_PATH/incoming' && test -d '$DEPLOY_PATH/releases' && test -d '$DEPLOY_PATH/shared'"
          scp -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=10 \
            "$RUNNER_TEMP/aicourse-release.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/incoming/$GITHUB_SHA.tar.gz"
      - name: Pull and deploy the verified commit
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$GITHUB_SHA' '$API_IMAGE' '$WEB_IMAGE' '$DEPLOY_PATH'" <<'REMOTE'
          set -euo pipefail
          release_sha=$1
          api_image=$2
          web_image=$3
          deploy_path=$4
          archive="$deploy_path/incoming/$release_sha.tar.gz"
          release="$deploy_path/releases/$release_sha"
          env_file="$deploy_path/shared/.env.production"
          backup_root="$deploy_path/shared/backups"

          test -f "$archive"
          test -f "$env_file"
          if [ ! -d "$release" ]; then
            mkdir "$release"
            tar -xzf "$archive" -C "$release"
          fi
          test -f "$release/docker-compose.production.yml"

          current=$(readlink -f "$deploy_path/current" 2>/dev/null || true)
          if [ -n "$current" ] && [ -x "$current/deploy/backup-production.sh" ] && \
            docker compose --env-file "$env_file" -f "$current/docker-compose.production.yml" \
              ps --services --status running | grep -qx mysql; then
            RELEASE_SHA=$(basename "$current") \
              "$current/deploy/backup-production.sh" "$env_file" "$backup_root"
          fi

          node "$release/deploy/validate-production-env.mjs" "$env_file"

          export API_IMAGE="$api_image" WEB_IMAGE="$web_image"
          docker compose --env-file "$env_file" -f "$release/docker-compose.production.yml" pull
          if ! {
            docker compose --env-file "$env_file" -f "$release/docker-compose.production.yml" \
              up -d --no-build --wait --wait-timeout 240 &&
            curl --fail --silent --show-error http://127.0.0.1:8088/healthz &&
            curl --fail --silent --show-error http://127.0.0.1:8088/api/v1/health/ready
          }; then
            if [ -n "$current" ] && [ -f "$current/.release-images" ]; then
              old_api=$(sed -n 's/^API_IMAGE=//p' "$current/.release-images")
              old_web=$(sed -n 's/^WEB_IMAGE=//p' "$current/.release-images")
              if [ -n "$old_api" ] && [ -n "$old_web" ]; then
                API_IMAGE=$old_api WEB_IMAGE=$old_web \
                  docker compose --env-file "$env_file" -f "$current/docker-compose.production.yml" \
                    up -d --no-build --wait --wait-timeout 240 || true
              fi
            fi
            exit 1
          fi

          printf 'API_IMAGE=%s\nWEB_IMAGE=%s\n' "$api_image" "$web_image" > "$release/.release-images"
          ln -sfn "$release" "$deploy_path/current"
          REMOTE
      - name: Remove temporary registry credentials
        if: always()
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'docker logout ghcr.io' || true
