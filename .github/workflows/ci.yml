name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config >/dev/null
      - name: Build API production image
        run: docker build --target api -t ai-academy-api:ci .
      - name: Build Web production image
        run: docker build --target web -t ai-academy-web:ci .

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai-academy/api db:generate
      - run: pnpm check
      # The configured mirror does not implement npm audit. Query npmjs directly
      # and fail only on critical advisories until the current high-severity
      # transitive findings are remediated in a dedicated dependency update.
      # GHSA-qwww-vcr4-c8h2 affects React Server Components mode. This Vite SPA
      # does not use RSC; keep it explicitly ignored until the stable v8 DOM
      # package is published and can be upgraded as a pair.
      - run: pnpm audit --registry=https://registry.npmjs.org --audit-level=high --ignore GHSA-qwww-vcr4-c8h2

  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ai_academy
          MYSQL_USER: ai_academy
          MYSQL_PASSWORD: ai_academy_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ai_academy:ai_academy_pass@127.0.0.1:3306/ai_academy
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-integration-key-7fb86cb4b1264ea1a7d479ad65fd
      API_HOST: 127.0.0.1
      API_PORT: 8080
      # MinIO 配置 (CI 默认值, 与 docker-compose.yml 一致)
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: ai-academy
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Start MinIO
        run: |
          docker run --detach --name ci-minio \
            --publish 9000:9000 --publish 9001:9001 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            --health-cmd="curl --fail http://127.0.0.1:9000/minio/health/live" \
            --health-interval=2s --health-timeout=2s --health-retries=15 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data --console-address ":9001"
          for _ in {1..30}; do
            minio_health=$(docker inspect --format '{{.State.Health.Status}}' ci-minio)
            if [ "$minio_health" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs ci-minio
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @ai-academy/api exec prisma migrate deploy
      - name: Create MinIO bucket + set anonymous download on public prefixes
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-08-13T08-35-41Z -c "
              mc alias set local http://127.0.0.1:9000 minioadmin minioadmin &&
              mc mb -p local/ai-academy || true &&
              mc anonymous set download local/ai-academy
            "
      - name: Verify production bootstrap on migrated empty database
        env:
          NODE_ENV: production
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_INITIAL_PASSWORD: ci-admin-5d7f9h1j3l5n7p9r
          SEED_STUDENT_EMAIL: ci-student@example.com
          SEED_STUDENT_PASSWORD: ci-student-6e8g1i3k5m7o9q2s
        run: pnpm --filter @ai-academy/api exec ts-node prisma/bootstrap-production.ts
      - run: pnpm --filter @ai-academy/api build
      - name: Start API
        run: pnpm --filter @ai-academy/api start > "$RUNNER_TEMP/api.log" 2>&1 &
      - name: Verify live API and dependencies
        run: |
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health/ready | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

  # Real dependency flow. This complements browser smoke coverage by exercising
  # the API, MySQL, Redis, MinIO, and the complete learning/certificate path.
  e2e-real-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [api-integration]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ai_academy
          MYSQL_USER: ai_academy
          MYSQL_PASSWORD: ai_academy_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ai_academy:ai_academy_pass@127.0.0.1:3306/ai_academy
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-e2e-real-key-2c8a4b6d8f0e2a4c6e8a0c2e4a6c8e0a
      API_HOST: 127.0.0.1
      API_PORT: 8080
      CORS_ORIGIN: http://127.0.0.1:5500
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: ai-academy
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Start MinIO
        run: |
          docker run --detach --name ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            --health-cmd="curl --fail http://127.0.0.1:9000/minio/health/live" \
            --health-interval=2s --health-timeout=2s --health-retries=15 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data
          for _ in {1..30}; do
            minio_health=$(docker inspect --format '{{.State.Health.Status}}' ci-minio)
            if [ "$minio_health" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs ci-minio
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @ai-academy/api exec prisma migrate deploy
      - name: Create MinIO bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-08-13T08-35-41Z -c \
            "mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb -p local/ai-academy"
      - name: Bootstrap production DB (admin + 演示数据)
        env:
          NODE_ENV: production
          ADMIN_EMAIL: ci-e2e-admin@example.com
          ADMIN_INITIAL_PASSWORD: ci-e2e-admin-StrongPwd-1a3b5c
          SEED_STUDENT_EMAIL: ci-e2e-student@example.com
          SEED_STUDENT_PASSWORD: ci-e2e-student-StrongPwd-2d4f6h
        run: pnpm --filter @ai-academy/api exec ts-node prisma/bootstrap-production.ts
      - run: pnpm --filter @ai-academy/api build
      - name: Start API
        run: pnpm --filter @ai-academy/api start > "$RUNNER_TEMP/api.log" 2>&1 &
      - name: Wait for API ready
        run: |
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health/ready | grep -q '"status":"ok"'; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Install Playwright Chromium
        run: pnpm --filter @ai-academy/web exec playwright install --with-deps chromium
      - name: Run browser E2E against the live API
        env:
          E2E_ADMIN_EMAIL: ci-e2e-admin@example.com
          E2E_ADMIN_PASSWORD: ci-e2e-admin-StrongPwd-1a3b5c
          E2E_STUDENT_EMAIL: ci-e2e-student@example.com
          E2E_STUDENT_PASSWORD: ci-e2e-student-StrongPwd-2d4f6h
        run: pnpm --filter @ai-academy/web e2e
      - name: Run real-dependency E2E business flow
        env:
          API_BASE_URL: http://127.0.0.1:8080/api
        run: node scripts/e2e-real-flow.mjs
      - name: Dump API log on failure
        if: failure()
        run: |
          echo "=== API log (last 200 lines) ==="
          tail -n 200 "$RUNNER_TEMP/api.log" || true

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [production-images, quality, api-integration, e2e-real-flow]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror pinned runtime images to GHCR
        shell: bash
        run: |
          set -euo pipefail
          images=(
            'mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b|ghcr.io/frankfika/aicourse-runtime:mysql-8.0-7dcddc01'
            'redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99|ghcr.io/frankfika/aicourse-runtime:redis-7-alpine-6ab0b6e7'
            'minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e|ghcr.io/frankfika/aicourse-runtime:minio-2025-09-07-14cea493'
            'minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727|ghcr.io/frankfika/aicourse-runtime:mc-2025-08-13-a7fe349e'
          )
          for mapping in "${images[@]}"; do
            source_image=${mapping%%|*}
            target_image=${mapping#*|}
            if docker manifest inspect "$target_image" >/dev/null 2>&1; then
              echo "Runtime mirror already exists: $target_image"
              continue
            fi
            docker pull --platform linux/amd64 "$source_image"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
          done
      - name: Build and publish API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: api
          push: true
          tags: |
            ghcr.io/frankfika/aicourse-api:${{ github.sha }}
            ghcr.io/frankfika/aicourse-api:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aicourse-api
          cache-to: type=gha,mode=max,scope=aicourse-api
      - name: Build and publish Web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: web
          push: true
          tags: |
            ghcr.io/frankfika/aicourse-web:${{ github.sha }}
            ghcr.io/frankfika/aicourse-web:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aicourse-web
          cache-to: type=gha,mode=max,scope=aicourse-web
