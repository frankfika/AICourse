  /api/v1/instructors:
    get:
      operationId: InstructorsPublicController_findAll_v1
      parameters:
      - name: search
        required: false
        in: query
        description: '搜索: name/title/headline 模糊匹配'
        schema:
          type: string
      - name: expertiseIds
        required: false
        in: query
        description: 按专长 ID 过滤 (多选 OR)
        schema:
          type: array
          items:
            type: string
      - name: published
        required: false
        in: query
        description: null=全部, true=已发布, false=草稿
        schema:
          type: boolean
      - name: sort
        required: false
        in: query
        description: '排序: orderIndex | name | recent'
        schema:
          default: orderIndex
          type: string
      - name: page
        required: false
        in: query
        description: 页码 (1-based)
        schema:
          minimum: 1
          default: 1
          type: number
      - name: limit
        required: false
        in: query
        description: 每页数量, max 100
        schema:
          minimum: 1
          maximum: 100
          default: 24
          type: number
      responses:
        '200':
          description: ''
      summary: 讲师列表 (前台, 仅 published)
      tags:
      - instructors (public)
