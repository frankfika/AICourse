info:
  title: AI Academy API
  description: AI and LLM education platform API
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    PasswordResetRequestDto:
      type: object
      properties:
        email:
          type: string
          description: Account email to send the reset link to
          example: user@example.com
          maxLength: 320
      required:
      - email
    PasswordResetConfirmDto:
      type: object
      properties:
        token:
          type: string
          description: Reset token from the email link
          minLength: 32
          maxLength: 256
        newPassword:
          type: string
          description: New password, 12-128 chars, must include uppercase, lowercase, digit, and symbol
          example: NewPass!5678
          minLength: 12
          maxLength: 128
      required:
      - token
      - newPassword
    OAuthCallbackDto:
      type: object
      properties:
        code:
          type: string
          description: OAuth2 authorization code from the IdP redirect
          minLength: 1
          maxLength: 2048
        state:
          type: string
          description: Opaque state token, must match what we issued in the auth URL
          minLength: 20
          maxLength: 4096
      required:
      - code
      - state
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          description: User email, must be RFC 5321 compliant
          example: user@example.com
          maxLength: 320
        password:
          type: string
          description: Password, 12-128 chars, must include uppercase, lowercase, digit, and symbol
          example: GoodPass!1234
          minLength: 12
          maxLength: 128
        name:
          type: string
          description: Display name shown in UI
          example: 陈大文
          maxLength: 120
      required:
      - email
      - password
      - name
    LoginDto:
      type: object
      properties:
        email:
          type: string
          description: Registered email
          example: user@example.com
        password:
          type: string
          description: Plaintext password (TLS only, never logged)
          example: GoodPass!1234
      required:
      - email
      - password
    CreateUserDto:
      type: object
      properties:
        email:
          type: string
          description: 邮箱
          example: '[email protected]'
        password:
          type: string
          description: 密码（至少 12 位，包含大小写、数字和符号）
          minLength: 12
        name:
          type: string
          description: 显示名
        role:
          type: string
          enum:
          - admin
          - student
          - instructor
          description: 用户角色
      required:
      - email
      - password
      - name
      - role
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          description: 当前密码
        newPassword:
          type: string
          description: 新密码，至少 12 位且包含大小写字母、数字和符号
      required:
      - currentPassword
      - newPassword
    UpdateUserDto:
      type: object
      properties:
        name:
          type: string
          description: 显示名
        avatarUrl:
          type: string
          description: 头像 URL (http/https)
        role:
          type: string
          enum:
          - admin
          - student
          - instructor
          description: 用户角色（仅管理员可修改）
    GrantCourseAccessDto:
      type: object
      properties:
        courseIds:
          description: 要授权的课程 UUID 列表
          type: array
          items:
            type: string
            format: uuid
      required:
      - courseIds
    GrantDegreeAccessDto:
      type: object
      properties:
        degreeIds:
          description: 要授权的学位 UUID 列表
          type: array
          items:
            type: string
            format: uuid
      required:
      - degreeIds
    CreateResourceDto:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
          description: 资源 URL (http/https)
        type:
          type: string
          enum:
          - pdf
          - code
          - link
          - video
          - audio
        isLocked:
          type: boolean
          default: true
      required:
      - title
      - url
      - type
    NestedCourseLessonDto:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        videoUrl:
          type: string
          description: 课时视频 URL (http/https)
        videoDuration:
          type: number
        isPreview:
          type: boolean
          default: false
        orderIndex:
          type: number
          description: 排序索引
        resources:
          description: 关联资源
          type: array
          items:
            $ref: '#/components/schemas/CreateResourceDto'
      required:
      - title
    CreateChapterDto:
      type: object
      properties:
        title:
          type: string
          description: 章节标题
        description:
          type: string
          description: 章节描述
        orderIndex:
