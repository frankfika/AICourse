      - orderIndex
    CreateCourseDto:
      type: object
      properties:
        title:
          type: string
          description: 课程标题
        description:
          type: string
          description: 课程描述
        learningPoints:
          type: string
          description: 学习要点
        instructor:
          type: string
          description: 讲师名称
        instructorId:
          type: string
          description: 讲师用户 UUID
        level:
          type: string
          enum:
          - Beginner
          - Intermediate
          - Advanced
          - Expert
          description: 难度等级
        duration:
          type: string
          description: 学习时长（人类可读，例如 "8h"）
        thumbnail:
          type: string
          description: 课程缩略图 URL
        tags:
          type: string
          description: 标签（逗号分隔或 JSON 字符串）
        costType:
