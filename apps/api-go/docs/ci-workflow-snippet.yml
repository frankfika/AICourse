# GitHub Actions CI snippet for apps/api-go.
#
# IMPORTANT (Frank, 2026-08-10):
# This file lives at apps/api-go/docs/ci-workflow-snippet.yml on purpose.
# GH workflow files under .github/workflows/ require the `workflow` OAuth scope
# to push. The Mavis agent does not have that scope on this repo, so it cannot
# commit this snippet into .github/workflows/ directly.
#
# To enable CI for the Go API:
#   1. Copy this file to .github/workflows/api-go-test.yml at the repo root
#   2. Commit + push it yourself (you have the `workflow` scope on frankfika)
#   3. The next push to apps/api-go/** will trigger the workflow
#
# Why a separate workflow file (not the existing ai-course-ci.yml):
# - The existing workflow is pnpm-based and tied to apps/api (NestJS)
# - The Go API builds with go modules, not pnpm
# - Mixing them means the existing workflow's path filter would have to
#   exclude apps/api-go/** which gets messy
# - Cleaner to have a focused api-go-test.yml

name: api-go-test

on:
  push:
    paths:
      - 'apps/api-go/**'
      - 'prisma/**'
      - '.github/workflows/api-go-test.yml'
  pull_request:
    paths:
      - 'apps/api-go/**'
      - 'prisma/**'
      - '.github/workflows/api-go-test.yml'

jobs:
  test:
    name: test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_pw
          MYSQL_DATABASE: ai_academy_test
          MYSQL_USER: ai_academy
          MYSQL_PASSWORD: ai_academy_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_pw"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: ai_academy_minio
          MINIO_ROOT_PASSWORD: ai_academy_minio_pass
        ports:
          - 9000:9000
          - 9001:9001
        options: --health-cmd="curl -f http://localhost:9000/minio/health/ready" --health-interval=5s --health-timeout=3s --health-retries=20

    env:
      NODE_ENV: test
      JWT_SECRET: f8e7d6c5b4a39281ffeeddccbbaa99887766554433221100aabbccddeeff0011
      DATABASE_URL: mysql://ai_academy:ai_academy_pass@127.0.0.1:3306/ai_academy_test
      REDIS_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: ai-academy
      S3_ACCESS_KEY: ai_academy_minio
      S3_SECRET_KEY: ai_academy_minio_pass
      LOG_LEVEL: warn

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: apps/api-go/go.sum

      - name: build
        working-directory: apps/api-go
        run: go build ./cmd/server ./internal/... ./test/...

      - name: unit + handler tests
        working-directory: apps/api-go
        run: go test -race -count=1 ./internal/...

      - name: e2e
        working-directory: apps/api-go
        run: go test -race -count=1 ./test/e2e/...

      - name: integration (dockertest)
        working-directory: apps/api-go
        run: go test -race -count=1 ./test/integration/...

      - name: coverage
        working-directory: apps/api-go
        run: |
          go test -count=1 -coverprofile=coverage.out -covermode=atomic ./internal/... ./test/...
          go tool cover -func=coverage.out | tail -1
        # Total coverage gate (post-Phase 1): enforce 70%
        # if [ $(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%') -lt 70 ]; then
        #   echo "::error::coverage below 70%"; exit 1
        # fi
