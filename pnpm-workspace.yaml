packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  esbuild: true
  prisma: true
  protobufjs: true

overrides:
  tar: '>=7.5.11'
  js-yaml: '>=4.2.0'
  multer: '>=2.2.0'
  # Keep security fixes within the majors this repository has validated.
  # A lower-bound override (">=") silently upgraded Vite 6 → 8 and Vitest 2 → 4.
  vite: '6.4.3'
  vitest: '3.2.6'
  # P0 2026-07-23 安全加固: 4 个依赖漏洞修复
  # - semver 6.0-6.3.1 ReDoS (经 bcrypt / jest chain)
  # - tmp <0.2.6 path traversal (经 @nestjs/cli chain)
  # - fast-uri 3.0-3.1.3 host confusion ReDoS (经 @nestjs/cli chain)
  semver: '>=6.3.1'
  tmp: '>=0.2.6'
  fast-uri: '>=3.1.4'
