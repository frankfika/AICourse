map $http_x_forwarded_proto $external_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Ordinary API requests are JSON and the Nest app caps them at 100 KB.
    # Keep a small proxy-side ceiling so unauthenticated oversized bodies are
    # rejected before Nginx buffers them to disk.
    client_max_body_size 1m;

    # Course content may use administrator-configured HTTPS images, direct
    # video files, or embedded players (for example YouTube/Bilibili). Keep
    # executable scripts same-origin while allowing those isolated media
    # surfaces to load in the production image.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; frame-src 'self' https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /admin/\nDisallow: /api/\nDisallow: /dashboard/\n\nSitemap: $external_scheme://$http_host/sitemap.xml\n";
    }

    location = /sitemap.xml {
        proxy_pass http://api:8080/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    # The public S3 endpoint uses path-style URLs signed as /ai-academy/<key>.
    # Preserve Host, path and query exactly or MinIO will reject the signature.
    location /ai-academy/ {
        # Signed object-storage uploads are the only large-body path.
        client_max_body_size 5g;
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
